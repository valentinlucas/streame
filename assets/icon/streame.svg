<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2140"/>
      <stop offset="1" stop-color="#0b3a4a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#7cf29a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Fond : carré arrondi macOS -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Écran HDMI : cadre 16:9 -->
  <rect x="352" y="300" width="440" height="260" rx="28" fill="url(#screen)" opacity="0.28"/>
  <rect x="352" y="300" width="440" height="260" rx="28" fill="none" stroke="#f4f7fb" stroke-width="30"/>
  <path d="M492 640 H652" stroke="#f4f7fb" stroke-width="30" stroke-linecap="round"/>
  <path d="M572 575 V640" stroke="#f4f7fb" stroke-width="30" stroke-linecap="round"/>
  <!-- Point « à l'antenne » -->
  <circle cx="732" cy="360" r="26" fill="#ff5a5f"/>
  <!-- Téléphone, incliné -->
  <g transform="translate(300 560) rotate(-14)">
    <rect x="-95" y="-190" width="190" height="380" rx="38" fill="#141a2e" stroke="#f4f7fb" stroke-width="26"/>
    <rect x="-64" y="-150" width="128" height="280" rx="14" fill="url(#screen)"/>
    <circle cx="0" cy="158" r="12" fill="#f4f7fb"/>
  </g>
</svg>
