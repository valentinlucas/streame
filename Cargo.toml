[workspace]
members = ["crates/streame-rtc", "crates/streame-ios"]
resolver = "2"

[package]
name = "streame"
version = "0.1.0"
edition = "2021"
description = "Régie vidéo légère : caméra/son d'un téléphone en WebRTC → sortie HDMI d'un Mac, scènes, multiview, Stream Deck"
license = "MIT"

[dependencies]
# Code média partagé avec l'app iOS (signaling, PeerConnection, Opus, H264) : voir crates/streame-rtc.
streame-rtc = { path = "crates/streame-rtc" }

# WebRTC en Rust (crate async `webrtc` + cœur sans-I/O `rtc`) : ICE/DTLS/SRTP/RTP,
# jitter buffer, TWCC/NACK. Remplace webrtcbin de GStreamer.
webrtc = "=0.21.0-rc.2"
rtc = "=0.21.0-rc.2"
async-trait = "0.1"
bytes = "1"
rand = "0.8"

# Serveur web + signaling
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
futures-util = "0.3"
local-ip-address = "0.6"
# Annonce Bonjour `_streame._tcp` (découverte de la régie par l'app iOS).
mdns-sd = "0.21"
hostname = "0.4"
qrcode = { version = "0.14", default-features = false }

# Fenêtres (sortie HDMI + multiview) et rendu GPU (Metal sur macOS via wgpu)
winit = "0.30"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }

# Pilotage OSC (UDP) depuis QLab, Companion…
rosc = "0.11"

# Stream Deck
elgato-streamdeck = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"

# Divers
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- macOS uniquement (chaîne média native : CoreAudio, VideoToolbox, AVFoundation, Metal) ---
# Sortie/entrée audio multicanal directe (CoreAudio) ; mixage, routage et VU-mètres dans le
# callback temps réel, à l'horloge de la carte.
cpal = "0.15"
# Tampons sans verrou entre les producteurs (réseau, fichiers) et le thread temps réel CoreAudio.
ringbuf = "0.4"
# Codec Opus en Rust (retour vers le téléphone, décodage du micro du téléphone). Lie la libopus
# système (brew install opus).
opus = "0.3"
# Chaîne vidéo native zéro-copie : VideoToolbox (décodage matériel du téléphone) et AVFoundation
# (fichiers d'habillage) → CVPixelBuffer/IOSurface → texture Metal importée dans wgpu. Versions
# alignées sur celles de wgpu-hal 30 (objc2 0.6 / frameworks 0.3.2) pour partager les types.
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = { version = "0.3.2", features = ["objc2-io-surface", "objc2-metal"] }
objc2-io-surface = "0.3.2"
objc2-video-toolbox = "0.3.2"
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media", "objc2-core-video"] }
objc2-avf-audio = "0.3.2"
objc2-metal = { version = "0.3.2", features = ["objc2-io-surface"] }

[profile.release]
opt-level = 3
debug = false
