# Configuration Streame — voir README.md pour le détail des options.

[server]
bind = "0.0.0.0:8443"
cert_dir = "certs"
stun_server = "stun://stun.l.google.com:19302"
rtc_latency_ms = 60
video_codec = "H264"
h264_profile_level_id = "42e01f"
return_audio_bitrate = 64000

[video]
width = 1920
height = 1080
fps = 30
mixer_latency_ms = 60

[output]
display = "HDMI"
fullscreen = true

[multiview]
enabled = true
width = 1280
height = 720
columns = 4
display = ""

[audio]
enabled = true
output_device = "WING"
input_device = "WING"
output_channels = 0
input_channels = 0
stream_output_channels = [
    3,
    4,
]
branding_output_channels = [
    1,
    2,
]
return_from_input_channels = [1]
sample_rate = 48000
meters = true

[transition]
kind = "fade"
duration_ms = 400

[streamdeck]
enabled = true
serial = ""
brightness = 60

[[streamdeck.buttons]]
index = 0
action = "program"
scene = "black"
label = ""
color = ""

[[streamdeck.buttons]]
index = 1
action = "program"
scene = "live"
label = ""
color = ""

[[streamdeck.buttons]]
index = 2
action = "program"
scene = "branding"
label = ""
color = ""

[[streamdeck.buttons]]
index = 3
action = "program"
scene = "overlay"
label = ""
color = ""

[[streamdeck.buttons]]
index = 4
action = "take"
scene = ""
label = "TAKE"
color = ""

[[scenes]]
id = "black"
name = "Noir"

[[scenes.layers]]
kind = "color"
color = "#000000"
x = 0
y = 0

[[scenes]]
id = "live"
name = "Direct"

[[scenes.layers]]
kind = "phone"
x = 0
y = 0
opacity = 1.0

[[scenes]]
id = "branding"
name = "Habillage"

[[scenes.layers]]
kind = "phone"
x = 0
y = 0
opacity = 1.0

[[scenes.layers]]
kind = "image"
path = "assets/lower-third.png"
x = 0
