# Configuration Streame — voir README.md pour le détail des options.

[server]
bind = "0.0.0.0:8443"
cert_dir = "certs"
stun_server = ""   # vide sur un réseau local ; ex. "stun:stun.l.google.com:19302" hors LAN
video_codec = "H264"
h264_profile_level_id = "42e01f"
return_audio_bitrate = 64000
video_start_bitrate_kbps = 3000
video_max_bitrate_kbps = 4000
keyframe_interval_s = 10
mdns = true
name = ""

[video]
width = 1920
height = 1080
fps = 30
mixer_latency_ms = 60
av_offset_ms = 80

[output]
# Écran de sortie (nom ou index, voir `streame devices`). Absent = sortie en fenêtre jusqu'à
# son branchement ; la fenêtre suit les débranchements et rebranchements.
display = "HDMI"
# Couvre l'écran : sans bordure, au-dessus de tout, curseur masqué, veille bloquée (F / Échap).
fullscreen = true

[multiview]
enabled = true
width = 1280
height = 720
columns = 4
display = ""
clock = false

[audio]
enabled = true
output_device = "WING"
input_device = "WING"
output_channels = 0
input_channels = 0
stream_output_channels = [
    3,
    4,
]
branding_output_channels = [
    1,
    2,
]
return_from_input_channels = [1]
sample_rate = 48000
meters = true

[transition]
kind = "fade"
duration_ms = 400

[streamdeck]
enabled = true
serial = ""
brightness = 60

[[streamdeck.buttons]]
index = 0
action = "program"
scene = "black"
label = ""
color = ""

[[streamdeck.buttons]]
index = 1
action = "program"
scene = "live"
label = ""
color = ""

[[streamdeck.buttons]]
index = 2
action = "program"
scene = "branding"
label = ""
color = ""

[[streamdeck.buttons]]
index = 3
action = "program"
scene = "overlay"
label = ""
color = ""

[[streamdeck.buttons]]
index = 4
action = "take"
scene = ""
label = "TAKE"
color = ""

# Pilotage OSC (UDP) depuis QLab (cues Réseau), Companion, TouchOSC… :
#   /streame/program <id>   passage à l'antenne (transition)   ex. : /streame/program generique
#   /streame/cut <id>       bascule immédiate
#   /streame/preview <id>   preview
#   /streame/take           preview → programme
# L'identifiant peut aussi terminer l'adresse (/streame/program/generique) ou être un entier
# (numéro de scène à partir de 1). Une scène déjà à l'antenne redemandée relance son générique.
[osc]
enabled = true
bind = "0.0.0.0:53100"

[[scenes]]
id = "black"
name = "Noir"

[[scenes.layers]]
kind = "color"
color = "#000000"
x = 0
y = 0

[[scenes]]
id = "live"
name = "Direct"

[[scenes.layers]]
kind = "phone"
x = 0
y = 0
opacity = 1.0

[[scenes]]
id = "branding"
name = "Habillage"

[[scenes.layers]]
kind = "phone"
x = 0
y = 0
opacity = 1.0

[[scenes.layers]]
kind = "image"
path = "assets/lower-third.png"
x = 0
y = 0
opacity = 1.0

[[scenes.layers]]
kind = "text"
text = "EN DIRECT"
font = "Sans Bold 40"
color = "#FFFFFF"
x = 120
y = 900
width = 600
height = 90

[[scenes]]
id = "overlay"
name = "Overlay vidéo"

[[scenes.layers]]
kind = "phone"
x = 0
y = 0
opacity = 1.0

[[scenes.layers]]
kind = "video"
path = "assets/overlay.mp4"
loop = true
x = 1280
y = 60
width = 576
height = 324
opacity = 0.9

# Générique lu une fois puis boucle, (re)démarrés quand la scène passe à l'antenne (cue QLab),
# arrêtés quand elle la quitte. Son ignoré (QLab joue le générique). Deux fichiers…
[[scenes]]
id = "generique"
name = "Générique"

[[scenes.layers]]
kind = "video"
path = "assets/generique.mov"
then = "assets/generique-boucle.mov"
audio = false

# … ou un seul fichier : lu de 0 à loop_to_ms, puis boucle entre loop_from_ms et loop_to_ms
# (loop_to_ms absent = fin du fichier).
#[[scenes.layers]]
#kind = "video"
#path = "assets/generique.mov"
#loop_from_ms = 12000
#audio = false

# Habillage ProRes 4444 avec alpha (détecté automatiquement) superposé au téléphone : générique
# puis boucle, comme ci-dessus.
[[scenes]]
id = "habillage-alpha"
name = "Habillage alpha"

[[scenes.layers]]
kind = "phone"

[[scenes.layers]]
kind = "video"
path = "assets/habillage-intro.mov"
then = "assets/habillage-boucle.mov"
audio = false
