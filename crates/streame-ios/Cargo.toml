[package]
name = "streame-ios"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bibliothèque statique (API C) de la session téléphone Streame pour l'app iOS"

[lib]
name = "streame_ios"
crate-type = ["staticlib"]

[dependencies]
streame-rtc = { path = "../streame-rtc", features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"
