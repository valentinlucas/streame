[package]
name = "streame-rtc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cœur média de Streame partagé entre la régie Mac et l'app iOS : signaling, webrtc-rs, Opus (libopus), H264 (VideoToolbox), audio cpal"

[features]
default = []
# Côté téléphone (app iOS, banc de test sur Mac) : session WebSocket + WebRTC « répondeur »,
# encodage H264 VideoToolbox, capture/lecture audio cpal, TLS client (certificat auto-signé).
client = [
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:ring",
    "dep:ringbuf",
    "dep:objc2-core-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:objc2-video-toolbox",
]

# Audio par cpal (périphériques par défaut) : bancs, Mac. L'app iOS fournit son propre moteur.
cpal-audio = ["client", "dep:cpal"]

[dependencies]
webrtc = "=0.21.0-rc.2"
rtc = "=0.21.0-rc.2"
async-trait = "0.1"
bytes = "1"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
# libopus (brew install opus sur Mac ; compilée depuis les sources par cmake pour iOS).
opus = "0.3"

# --- feature `client` ---
futures-util = { version = "0.3", optional = true }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
ring = { version = "0.17", optional = true }
cpal = { version = "0.15", optional = true }
ringbuf = { version = "0.4", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true }
objc2-core-media = { version = "0.3.2", optional = true }
objc2-core-video = { version = "0.3.2", optional = true }
objc2-video-toolbox = { version = "0.3.2", optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "fake_phone"
required-features = ["client"]
