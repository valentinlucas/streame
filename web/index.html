<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Streame — caméra</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>📱 Streame — caméra</h1>
<label for="name">Nom</label>
<input id="name" placeholder="iPhone de Valentin">
<div class="row">
  <div>
    <label for="camera">Caméra</label>
    <select id="camera">
      <option value="environment">Arrière</option>
      <option value="user">Avant</option>
    </select>
  </div>
  <div>
    <label for="quality">Qualité</label>
    <select id="quality">
      <option value="1080">1080p</option>
      <option value="720" selected>720p</option>
      <option value="480">480p</option>
    </select>
  </div>
</div>
<button id="connect">Connecter</button>
<button id="mute" class="secondary" disabled>Couper le micro</button>
<div id="status">Prêt.</div>
<video id="local" autoplay muted playsinline></video>
<audio id="remote" autoplay playsinline></audio>
<script src="/app.js"></script>
</body>
</html>
